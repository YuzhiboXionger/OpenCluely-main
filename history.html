<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>历史记录</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <link href="./node_modules/prismjs/themes/prism-tomorrow.css" rel="stylesheet" />
    <style>
      :root {
        --bg: rgba(12, 12, 14, 0.92);
        --panel: rgba(255, 255, 255, 0.035);
        --panel-hover: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.16);
        --danger: #f87171;
        --star: #fbbf24;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: hidden;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
        font-size: 13px;
      }

      .history-app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      .history-header {
        height: 52px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.22);
        -webkit-app-region: drag;
      }

      .history-header button,
      .history-header input,
      .history-header select {
        -webkit-app-region: no-drag;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .header-title i { color: var(--accent); }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .btn:hover { background: var(--panel-hover); border-color: rgba(255, 255, 255, 0.18); }
      .btn:active { transform: translateY(1px); }
      .btn i { font-size: 12px; }
      .btn-danger { color: var(--danger); }
      .btn-danger:hover { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.35); }
      .btn-small { height: 26px; padding: 0 9px; font-size: 11px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover { background: var(--panel-hover); }

      .history-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      .session-pane {
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.015);
      }

      .filters {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-bottom: 1px solid var(--border);
      }

      .search-box {
        position: relative;
      }

      .search-box i {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 12px;
        pointer-events: none;
      }

      .search-box input {
        width: 100%;
        height: 32px;
        padding: 0 10px 0 30px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.25);
        color: var(--text);
        outline: none;
        font-size: 12px;
      }
      .search-box input:focus { border-color: rgba(96, 165, 250, 0.5); }

      .filter-row { display: flex; gap: 8px; }
      .filter-row select {
        flex: 1;
        height: 30px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.25);
        color: var(--text);
        padding: 0 8px;
        outline: none;
        font-size: 12px;
      }

      .session-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .session-card {
        padding: 10px 11px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: var(--panel);
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .session-card:hover { background: var(--panel-hover); }
      .session-card.selected {
        border-color: rgba(96, 165, 250, 0.55);
        background: var(--accent-soft);
      }

      .session-card-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .session-card-sub {
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        flex-wrap: wrap;
      }

      .session-card-last {
        margin-top: 6px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .session-date-group {
        padding: 7px 4px 1px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 6px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .badge-written { background: rgba(96, 165, 250, 0.18); color: #93c5fd; }
      .badge-interview { background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
      .badge-mixed { background: rgba(251, 191, 36, 0.16); color: #fcd34d; }
      .badge-active { background: rgba(34, 197, 94, 0.18); color: #86efac; }
      .badge-type { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.7); }

      .detail-pane {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .empty-state i { font-size: 28px; opacity: 0.4; }

      .detail-header {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .detail-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .title-input {
        flex: 1;
        min-width: 0;
        font-size: 18px;
        font-weight: 650;
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 4px 8px;
        outline: none;
      }
      .title-input:hover { border-color: var(--border); }
      .title-input:focus { border-color: rgba(96, 165, 250, 0.5); background: rgba(0, 0, 0, 0.2); }

      .type-select {
        height: 30px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.25);
        color: var(--text);
        padding: 0 8px;
        outline: none;
        font-size: 12px;
      }

      .detail-meta {
        margin-top: 7px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 11px;
      }

      .detail-actions {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .detail-actions .spacer { flex: 1; }

      .record-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 14px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .record-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
        flex-shrink: 0;
        transition: border-color 0.15s ease;
      }
      .record-card:hover { border-color: rgba(255, 255, 255, 0.16); }

      .record-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
        cursor: pointer;
        user-select: none;
      }

      .record-index {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--muted);
        font-size: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .record-time { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .record-spacer { flex: 1; }

      .record-actions { display: flex; align-items: center; gap: 2px; }

      .record-action {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .record-action:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
      .record-action.is-starred { color: var(--star); }
      .record-action.is-starred:hover { color: var(--star); }
      .record-action.danger:hover { color: var(--danger); background: rgba(248, 113, 113, 0.1); }

      .record-question {
        padding: 0 12px 10px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 12.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .record-card.expanded .record-question {
        display: block;
        -webkit-line-clamp: unset;
        color: var(--text);
      }

      .record-body {
        border-top: 1px solid var(--border);
        padding: 12px;
        background: rgba(0, 0, 0, 0.16);
      }

      .markdown-body {
        font-size: 12.5px;
        line-height: 1.65;
        color: rgba(255, 255, 255, 0.88);
        word-break: break-word;
      }
      .markdown-body p { margin: 0 0 8px; }
      .markdown-body p:last-child { margin-bottom: 0; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
        margin: 12px 0 6px;
        font-size: 14px;
        color: #fff;
      }
      .markdown-body ul, .markdown-body ol { margin: 0 0 8px; padding-left: 20px; }
      .markdown-body li { margin: 2px 0; }
      .markdown-body code {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 1px 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
      }
      .markdown-body pre {
        margin: 8px 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 7px;
        border: 1px solid var(--border);
        overflow-x: auto;
      }
      .markdown-body pre code {
        background: transparent;
        padding: 0;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .markdown-body blockquote {
        margin: 8px 0;
        padding: 2px 10px;
        border-left: 3px solid rgba(96, 165, 250, 0.5);
        color: var(--muted);
      }
      .markdown-body table { border-collapse: collapse; margin: 8px 0; }
      .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 4px 8px; }

      .record-note {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 7px;
        border-left: 3px solid rgba(251, 191, 36, 0.6);
        background: rgba(251, 191, 36, 0.07);
        color: rgba(255, 255, 255, 0.75);
        font-size: 11.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .note-editor { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
      .note-editor textarea {
        width: 100%;
        min-height: 60px;
        resize: vertical;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.3);
        color: var(--text);
        padding: 8px;
        font-size: 12px;
        line-height: 1.5;
        outline: none;
      }
      .note-editor textarea:focus { border-color: rgba(96, 165, 250, 0.5); }
      .note-editor-actions { display: flex; gap: 6px; }
      .note-editor-actions .spacer { flex: 1; }

      .loading-hint, .list-empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 18px 10px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%) translateY(10px);
        background: rgba(20, 20, 22, 0.95);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 100;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }
    </style>
  </head>
  <body>
    <div class="history-app">
      <header class="history-header">
        <div class="header-title">
          <i class="fas fa-clock-rotate-left"></i>
          历史记录
        </div>
        <div class="header-actions">
          <button class="btn" id="newSessionBtn" title="新建场次">
            <i class="fas fa-plus"></i>
            新建场次
          </button>
          <button class="btn" id="exportAllBtn" title="导出全部历史">
            <i class="fas fa-download"></i>
            导出
          </button>
          <button class="btn btn-danger" id="clearAllBtn" title="清空全部历史">
            <i class="fas fa-trash"></i>
            清空
          </button>
          <button class="icon-btn" id="closeBtn" title="关闭">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </header>

      <div class="history-body">
        <aside class="session-pane">
          <div class="filters">
            <div class="search-box">
              <i class="fas fa-magnifying-glass"></i>
              <input id="searchInput" type="text" placeholder="搜索题目 / 答案 / 备注" />
            </div>
            <div class="filter-row">
              <select id="typeFilter">
                <option value="">全部类型</option>
                <option value="written_test">笔试</option>
                <option value="interview">面试</option>
                <option value="mixed">混合</option>
              </select>
              <select id="skillFilter">
                <option value="">全部技能</option>
                <option value="dsa">算法 / 笔试</option>
                <option value="interview">面试问答</option>
              </select>
            </div>
          </div>
          <div class="session-list" id="sessionList"></div>
        </aside>

        <main class="detail-pane">
          <div class="empty-state" id="emptyDetail">
            <i class="fas fa-folder-open"></i>
            <div>选择左侧场次查看问答记录</div>
          </div>

          <div id="sessionDetail" style="display: none; flex-direction: column; flex: 1; min-height: 0;">
            <div class="detail-header">
              <div class="detail-title-row">
                <input class="title-input" id="sessionTitle" maxlength="80" />
                <select class="type-select" id="sessionType">
                  <option value="written_test">笔试</option>
                  <option value="interview">面试</option>
                  <option value="mixed">混合</option>
                </select>
              </div>
              <div class="detail-meta" id="sessionMeta"></div>
              <div class="detail-actions">
                <button class="btn btn-small" id="endSessionBtn">
                  <i class="fas fa-flag-checkered"></i>
                  结束场次
                </button>
                <button class="btn btn-small" id="exportSessionBtn">
                  <i class="fas fa-download"></i>
                  导出本场
                </button>
                <div class="spacer"></div>
                <button class="btn btn-small btn-danger" id="removeSessionBtn">
                  <i class="fas fa-trash"></i>
                  删除场次
                </button>
              </div>
            </div>
            <div class="record-list" id="recordList"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="./node_modules/marked/marked.min.js"></script>
    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="lib/mathrender.js"></script>
    <script>
      try {
        if (window.Prism && Prism.plugins && Prism.plugins.autoloader) {
          Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/';
        }
      } catch (_) {}
    </script>
    <script src="./src/ui/history-window.js"></script>
  </body>
</html>
